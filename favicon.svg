<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&amp;display=swap');
    </style>
  </defs>

  <!-- Fundo branco arredondado -->
  <rect width="32" height="32" rx="8" fill="#ffffff"/>

  <!-- Borda sutil -->
  <rect width="32" height="32" rx="8" fill="none" stroke="#A55927" stroke-width="1" stroke-opacity="0.25"/>

  <!-- T em Playfair Display itálico -->
  <text
    x="16" y="26"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-style="italic"
    font-weight="700"
    font-size="27"
    fill="#A55927"
  >T</text>
</svg>
