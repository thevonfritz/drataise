<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obrigada · Dra. Taise Torres</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../style.css" />

  <style>
    body {
      background: var(--bg);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .ty {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      padding: 3.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 48px rgba(29,16,7,.08);
    }

    /* Ícone de check */
    .ty__icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid rgba(165,89,39,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ty__icon svg {
      width: 26px;
      height: 26px;
      stroke: var(--red);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Eyebrow */
    .ty__eyebrow {
      font-family: var(--font-sans);
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--red);
    }

    /* Título */
    .ty__title {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--text);
      line-height: .92;
      letter-spacing: -.02em;
    }
    .ty__title em {
      font-style: italic;
      color: var(--red);
    }

    /* Divisor */
    .ty__divider {
      width: 40px;
      height: 1px;
      background: var(--line);
    }

    /* Subtítulo */
    .ty__sub {
      font-size: .97rem;
      font-weight: 300;
      color: var(--text-mid);
      line-height: 1.75;
    }
    .ty__sub strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Botão WhatsApp */
    .btn--wa {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: #25D366;
      color: #fff;
      font-family: var(--font-sans);
      font-size: .84rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-decoration: none;
      padding: .9rem 2rem;
      border-radius: var(--r-xl);
      transition: background var(--dur-fast) var(--ease-out),
                  transform  var(--dur-fast) var(--ease-out),
                  box-shadow var(--dur-fast) var(--ease-out);
      box-shadow: 0 6px 24px rgba(37,211,102,.25);
    }
    .btn--wa:hover {
      background: #1ebe5d;
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(37,211,102,.38);
    }
    .btn--wa svg {
      width: 19px;
      height: 19px;
      fill: #fff;
      flex-shrink: 0;
    }

    /* Nota */
    .ty__note {
      font-size: .75rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .ty {
        padding: 2.5rem 1.5rem;
        border-radius: var(--r-lg);
      }
      .ty__title { font-size: clamp(1.9rem, 9vw, 2.4rem); }
    }
  </style>
</head>
<body>

  <div class="ty">

    <div class="ty__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <p class="ty__eyebrow">Recebemos seu pedido</p>

    <h1 class="ty__title">Obrigada,<br><em>você está mais perto.</em></h1>

    <div class="ty__divider"></div>

    <p class="ty__sub">
      Nossa equipe entrará em contato em até <strong>24 horas</strong>
      para confirmar sua avaliação. Se preferir agilizar, fale diretamente
      com a Dra. Taise pelo WhatsApp.
    </p>

    <a
      href="https://wa.me/SEU_NUMERO"
      target="_blank"
      rel="noopener noreferrer"
      class="btn--wa"
      aria-label="Falar com a Dra. Taise pelo WhatsApp"
    >
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Falar pelo WhatsApp agora
    </a>

    <p class="ty__note">Você será redirecionada para o WhatsApp.</p>

  </div>

</body>
</html>
